[package]
name = "cc-lib"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jj-lib = "0.47.1"
async-trait = "0.1"
futures = "0.3"
cc-common = { path = "../common" }
tonic = { version = "0.12.3", features = ["tls", "tls-webpki-roots"] }
tokio = { version = "1.39", features = ["rt", "rt-multi-thread", "net", "process", "time", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
gix = "0.85.0"
tower = "0.4"
hyper-util = { version = "0.1", features = ["tokio"] }

