# Local PostgreSQL 17 + MinIO (S3-compatible) manifest for Kubernetes
# (`kubectl apply -f deploy/k8s/postgres.yaml`, then
# `kubectl port-forward svc/jj-cc-server 8080:8080 50052:50052`) or Podman
# (`cargo xtask up k8s-postgres --k8s-provider podman-kube`, which binds 127.0.0.1:8080 and
# 127.0.0.1:50052 via hostIP/hostPort, waits for Postgres initdb, and restarts jj-cc-server if
# needed; with standalone `podman kube play deploy/k8s/postgres.yaml`, run
# `podman start jj-cc-postgres-jj-cc-server` after Postgres initializes).
apiVersion: v1
kind: Pod
metadata:
  name: jj-cc-postgres
  labels:
    app: jj-cc-server
    mode: postgres
spec:
  restartPolicy: Always
  containers:
    - name: postgres
      image: docker.io/library/postgres:17-alpine
      env:
        - name: POSTGRES_USER
          value: "jj"
        - name: POSTGRES_PASSWORD
          value: "jj"
        - name: POSTGRES_DB
          value: "commit_cloud"
      ports:
        - containerPort: 5432
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
    - name: minio
      image: cgr.dev/chainguard/minio:latest
      args:
        - "server"
        - "/data"
        - "--address"
        - ":9000"
        - "--console-address"
        - ":9001"
      env:
        - name: MINIO_ROOT_USER
          value: "minioadmin"
        - name: MINIO_ROOT_PASSWORD
          value: "minioadmin"
      ports:
        - containerPort: 9000
      volumeMounts:
        - name: minio-data
          mountPath: /data
    - name: jj-cc-server
      image: localhost/jj-cc-server:local
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop: ["ALL"]
      env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8080"
        - name: METRICS_LISTEN
          value: "0.0.0.0:50052"
        - name: JJ_CC_ALLOW_UNAUTHENTICATED
          value: "true"
        - name: STORE_TYPE
          value: "postgres"
        - name: POSTGRES_URL
          value: "postgres://jj:jj@127.0.0.1:5432/commit_cloud?sslmode=disable"
        - name: POSTGRES_AUTO_MIGRATE
          value: "true"
        - name: BLOB_STORE
          value: "s3"
        - name: S3_BUCKET
          value: "jj-blobs"
        - name: S3_ENDPOINT
          value: "http://127.0.0.1:9000"
        - name: S3_REGION
          value: "us-east-1"
        - name: S3_ACCESS_KEY_ID
          value: "minioadmin"
        - name: S3_SECRET_ACCESS_KEY
          value: "minioadmin"
        - name: S3_PATH_STYLE
          value: "true"
        - name: S3_AUTO_CREATE_BUCKET
          value: "true"
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      ports:
        - containerPort: 8080
          hostIP: 127.0.0.1
          hostPort: 8080
          protocol: TCP
        - containerPort: 50052
          hostIP: 127.0.0.1
          hostPort: 50052
          protocol: TCP
      readinessProbe:
        grpc:
          port: 8080
        initialDelaySeconds: 2
        periodSeconds: 3
  volumes:
    - name: postgres-data
      emptyDir: {}
    - name: minio-data
      emptyDir: {}
    - name: tmp
      emptyDir:
        sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jj-cc-server
spec:
  type: ClusterIP
  selector:
    app: jj-cc-server
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 50052
      targetPort: 50052
