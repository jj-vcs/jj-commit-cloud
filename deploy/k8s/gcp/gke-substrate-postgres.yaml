# Kubernetes / GKE Agent Substrate manifest for jj-cc-server backed by CloudNativePG
# (PostgreSQL 17) + MinIO (S3-compatible object storage). Uses the exact same jj-cc-server image,
# OIDC Actor JWT + Kubernetes TokenReview authentication, /statz /metrics port (50052), and gRPC
# Service ports (50051 -> 8080) as deploy/k8s/gcp/gke-substrate.yaml.
#
# Prerequisites:
#   1. Grant jj-cc-server-ksa TokenReview permissions in your target namespace:
#        kubectl create clusterrolebinding jj-cc-server-auth-delegator \
#          --clusterrole=system:auth-delegator \
#          --serviceaccount=default:jj-cc-server-ksa
#   2. Create Secrets and ConfigMap for PostgreSQL, PostgreSQL CA, S3/MinIO, and the OIDC IDP CA:
#        kubectl create configmap substrate-idp-ca --from-file=ca.crt=./idp-ca.crt
#        kubectl create secret generic jj-cc-pg-ca --from-file=ca.crt=./pg-ca.crt
#        kubectl create secret generic jj-cc-postgres-app \
#          --from-literal=uri='postgres://app:<password>@jj-cc-pg-rw:5432/commit_cloud?sslmode=verify-full&sslrootcert=/etc/jj-cc/pg-ca/ca.crt'
#        kubectl create secret generic jj-cc-s3-credentials \
#          --from-literal=access-key='<access-key>' \
#          --from-literal=secret-key='<secret-key>'
#   3. Ensure PostgreSQL `max_connections` accommodates 4 replicas x `POSTGRES_MAX_CONNS` (40)
#      plus superuser/admin headroom (at least `max_connections = 200`), or reduce
#      `POSTGRES_MAX_CONNS` to `20` on clusters using PostgreSQL's default `max_connections = 100`.
#   4. Substitute template placeholders and apply:
#        sed \
#          -e "s|__IMAGE_URI__|${IMAGE_URI}|g" \
#          -e "s|__S3_BUCKET__|${S3_BUCKET:-jj-blobs}|g" \
#          -e "s|__S3_ENDPOINT__|${S3_ENDPOINT:-http://minio.default.svc:9000}|g" \
#          -e "s|__S3_REGION__|${S3_REGION:-us-east-1}|g" \
#          -e "s|__OIDC_ISSUER__|${OIDC_ISSUER:-https://idp.ate-system.svc}|g" \
#          -e "s|__OIDC_AUDIENCE__|${OIDC_AUDIENCE:-cloud-jj}|g" \
#          deploy/k8s/gcp/gke-substrate-postgres.yaml | kubectl apply -f -
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jj-cc-server-ksa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jj-cc-server
  labels:
    app: jj-cc-server
    profile: substrate-postgres
spec:
  replicas: 4
  selector:
    matchLabels:
      app: jj-cc-server
  template:
    metadata:
      labels:
        app: jj-cc-server
        profile: substrate-postgres
    spec:
      serviceAccountName: jj-cc-server-ksa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: jj-cc-server
          image: "__IMAGE_URI__"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: METRICS_LISTEN
              value: "0.0.0.0:50052"
            - name: STORE_TYPE
              value: "postgres"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jj-cc-postgres-app
                  key: uri
            - name: POSTGRES_MAX_CONNS
              value: "40"
            - name: POSTGRES_AUTO_MIGRATE
              value: "true"
            - name: POSTGRES_CA_CERT
              value: "/etc/jj-cc/pg-ca/ca.crt"
            - name: BLOB_STORE
              value: "s3"
            - name: S3_BUCKET
              value: "__S3_BUCKET__"
            - name: S3_ENDPOINT
              value: "__S3_ENDPOINT__"
            - name: S3_REGION
              value: "__S3_REGION__"
            - name: S3_PATH_STYLE
              value: "true"
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: jj-cc-s3-credentials
                  key: access-key
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: jj-cc-s3-credentials
                  key: secret-key
            - name: INLINE_BLOB_THRESHOLD_BYTES
              value: "16384"
            - name: BLOB_CACHE_BYTES
              value: "2147483648"
            - name: JJ_CC_AUTH_OIDC_ISSUER
              value: "__OIDC_ISSUER__"
            - name: JJ_CC_AUTH_OIDC_AUDIENCE
              value: "__OIDC_AUDIENCE__"
            - name: JJ_CC_AUTH_OIDC_CA_CERT
              value: "/etc/jj-cc/oidc-ca/ca.crt"
            - name: JJ_CC_AUTH_ENFORCE_ACTOR_REPO_SUFFIX
              value: "true"
            - name: JJ_CC_AUTH_K8S_TOKENREVIEW_URL
              value: "https://kubernetes.default.svc"
            - name: JJ_CC_AUTH_K8S_TOKENREVIEW_AUD
              value: "__OIDC_AUDIENCE__"
            - name: JJ_CC_AUTH_K8S_CA_CERT
              value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            - name: JJ_CC_AUTH_K8S_SA_TOKEN_FILE
              value: "/var/run/secrets/kubernetes.io/serviceaccount/token"
          volumeMounts:
            - name: oidc-ca
              mountPath: /etc/jj-cc/oidc-ca
              readOnly: true
            - name: pg-ca
              mountPath: /etc/jj-cc/pg-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
          ports:
            - name: grpc
              containerPort: 8080
            - name: metrics
              containerPort: 50052
          readinessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "1000m"
              memory: "3Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
      volumes:
        - name: oidc-ca
          configMap:
            name: substrate-idp-ca
            defaultMode: 0440
            optional: false
        - name: pg-ca
          secret:
            secretName: jj-cc-pg-ca
            defaultMode: 0440
            optional: false
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jj-cc-server
spec:
  type: ClusterIP
  selector:
    app: jj-cc-server
  ports:
    - name: grpc
      port: 50051
      targetPort: 8080
    - name: metrics
      port: 50052
      targetPort: 50052
