# Local single-node memory manifest for Podman (`podman kube play deploy/k8s/memory.yaml`,
# which binds 127.0.0.1:8080 via hostIP/hostPort) or Kubernetes
# (`kubectl apply -f deploy/k8s/memory.yaml`, then `kubectl port-forward svc/jj-cc-server 8080:8080`).
apiVersion: v1
kind: Pod
metadata:
  name: jj-cc-memory
  labels:
    app: jj-cc-server
    mode: memory
spec:
  containers:
    - name: jj-cc-server
      image: localhost/jj-cc-server:local
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop: ["ALL"]
      env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8080"
        - name: JJ_CC_ALLOW_UNAUTHENTICATED
          value: "true"
        - name: STORE_TYPE
          value: "memory"
        - name: BLOB_STORE
          value: "memory"
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      ports:
        - containerPort: 8080
          hostIP: 127.0.0.1
          hostPort: 8080
          protocol: TCP
      readinessProbe:
        grpc:
          port: 8080
        initialDelaySeconds: 2
        periodSeconds: 3
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jj-cc-server
spec:
  type: ClusterIP
  selector:
    app: jj-cc-server
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
