[package]
name = "jj-commit-cloud-server"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "jj_commit_cloud_server"
path = "src/lib.rs"

[[bin]]
name = "jj-cc-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "net", "signal", "process", "sync", "time", "fs", "io-util"] }
clap = { version = "4", features = ["derive", "env"] }
tonic = "0.12"
tonic-health = "0.12"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cc-common = { path = "../common" }
cc-lib = { path = "../lib" }
jj-lib = "0.47.1"
futures = "0.3"
pollster = "0.4"
rand = "0.8"
async-trait = "0.1"
bytes = "1"
prost = "0.13"
thiserror = "2"
axum = "0.7"
base64 = "0.22"
gix = "0.85.0"
hex = "0.4"
http = "1"
http-body = "1"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
lru = "0.16.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.4.13"
url = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
hmac = "0.13"
subtle = "2.6"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
tokio-postgres-rustls = "0.13"
google-cloud-spanner = "0.35.0"
google-cloud-storage = "1.22.0"
google-cloud-auth = "1.19.0"
google-cloud-gax = "1.15.0"

[dev-dependencies]
assert_cmd = "2.0"
aws-lc-rs = "1"
predicates = "3.1"
testutils = { path = "../testutils" }
