[package]
name = "jj-commit-cloud-daemon"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "jj_commit_cloud_daemon"
path = "src/lib.rs"

[[bin]]
name = "jj-cc-daemon"
path = "src/main.rs"

[dependencies]
bytes = "1"
cc-common = { path = "../common" }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
getrandom = "0.2"
hex = "0.4"
lru = "0.16.4"
prost = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tonic = { version = "0.12.3", features = ["tls-roots"] }
tonic-health = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
